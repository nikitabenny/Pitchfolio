services:
  player-service:
    build: ./player-service
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://${PLAYER_POSTGRES_USER}:${PLAYER_POSTGRES_PASSWORD}@player-db:5432/${PLAYER_POSTGRES_DB}
      - PLAYER_SERVICE_API_KEY=${PLAYER_SERVICE_API_KEY}
    depends_on:
      player-db:
        condition: service_healthy

  player-db:
    image: postgres:16
    environment:
      - POSTGRES_USER=${PLAYER_POSTGRES_USER}
      - POSTGRES_PASSWORD=${PLAYER_POSTGRES_PASSWORD}
      - POSTGRES_DB=${PLAYER_POSTGRES_DB}
    volumes:
      - player_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 10

  portfolio-service:
    build: ./portfolio-service
    ports:
      - "8002:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${PORTFOLIO_POSTGRES_USER}:${PORTFOLIO_POSTGRES_PASSWORD}@portfolio-db:5432/${PORTFOLIO_POSTGRES_DB}
    depends_on:
      portfolio-db:
        condition: service_healthy

  portfolio-db:
    image: postgres:16
    environment:
      - POSTGRES_USER=${PORTFOLIO_POSTGRES_USER}
      - POSTGRES_PASSWORD=${PORTFOLIO_POSTGRES_PASSWORD}
      - POSTGRES_DB=${PORTFOLIO_POSTGRES_DB}
    volumes:
      - portfolio_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 10

  forecast-service:
    build: ./forecast-service
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://${FORECAST_POSTGRES_USER}:${FORECAST_POSTGRES_PASSWORD}@forecast-db:5432/${FORECAST_POSTGRES_DB}
      - PLAYER_SERVICE_URL=http://player-service:8000
      - PLAYER_SERVICE_API_KEY=${PLAYER_SERVICE_API_KEY}
    depends_on:
      forecast-db:
        condition: service_healthy
      player-service:
        condition: service_started

  forecast-db:
    image: postgres:16
    environment:
      - POSTGRES_USER=${FORECAST_POSTGRES_USER}
      - POSTGRES_PASSWORD=${FORECAST_POSTGRES_PASSWORD}
      - POSTGRES_DB=${FORECAST_POSTGRES_DB}
    volumes:
      - forecast_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  player_pgdata:
  portfolio_pgdata:
  forecast_pgdata:
