services:
  forecast-service:
    build: .
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@forecast-db:5432/${POSTGRES_DB}
      - PLAYER_SERVICE_URL=${PLAYER_SERVICE_URL}
      - PLAYER_SERVICE_API_KEY=${PLAYER_SERVICE_API_KEY}
    depends_on:
      forecast-db:
        condition: service_healthy

  forecast-db:
    image: postgres:16
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
